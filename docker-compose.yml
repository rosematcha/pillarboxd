services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pillarboxd:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/pillarboxd
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (32+ random chars)}
      APP_URL: ${APP_URL:?set APP_URL, e.g. https://pillarboxd.example.com}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:?set TMDB_ACCESS_TOKEN (TMDB API read access token)}
    ports:
      - "3000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pillarboxd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pillarboxd
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pillarboxd -d pillarboxd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
